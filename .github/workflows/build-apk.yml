name: Build IG Focus APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          PROJECT=$(dirname $(find . -name "settings.gradle" | head -1))
          echo "Building from: $PROJECT"
          cd "$PROJECT"
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ig-focus-v3
          path: '**/app-debug.apk'
          retention-days: 30
